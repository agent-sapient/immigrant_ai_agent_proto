  int32 page = 2 [json_name = "page"]; // 页码，从1开始，默认1
  int32 page_size = 3 [json_name = "pageSize"]; // 每页数量，默认50，最大100
  string cursor = 4 [json_name = "cursor"]; // 游标（可选，用于游标分页，传入上次返回的最后一条消息ID）
}

// 获取奖项聊天消息响应
message GetAwardChatMessagesResponse {
  message Result {
    repeated AwardChatMessage messages = 1 [json_name = "messages"]; // 消息列表（按创建时间升序）
    int32 total = 2 [json_name = "total"]; // 总消息数
    int32 page = 3 [json_name = "page"]; // 当前页码
    int32 page_size = 4 [json_name = "pageSize"]; // 每页数量
    bool has_more = 5 [json_name = "hasMore"]; // 是否还有更多消息
    string next_cursor = 6 [json_name = "nextCursor"]; // 下一页游标（最后一条消息的ID）
  }
  bool success = 1 [json_name = "success"]; // 是否成功
  string message = 2 [json_name = "message"]; // 响应消息
  Result result = 3 [json_name = "result"]; // 结果
}

// 删除奖项聊天消息请求
message DeleteAwardChatMessagesRequest {
  string award_id = 1 [json_name = "awardId"]; // 奖项ID
  repeated string message_ids = 2 [json_name = "messageIds"]; // 要删除的消息ID列表（为空则删除该奖项所有消息）
}

// 删除奖项聊天消息响应
message DeleteAwardChatMessagesResponse {
  message Result {
    int32 deleted_count = 1 [json_name = "deletedCount"]; // 成功删除的消息数量
  }
  bool success = 1 [json_name = "success"]; // 是否成功
  string message = 2 [json_name = "message"]; // 响应消息
  Result result = 3 [json_name = "result"]; // 结果
}

// ========== 模块引导文案管理 ==========

// 获取模块引导文案请求
message GetModuleGuideRequest {
  string case_id = 1 [json_name = "caseId"]; // 案件ID
  string module = 2 [json_name = "module"]; // 模块标识: award, membership, media_coverage, judging, original_contribution, article, exhibition, key_role, high_income, commercial_success
}

// 获取模块引导文案响应
message GetModuleGuideResponse {
  message Result {
    string guide_text = 1 [json_name = "guideText"]; // 引导文案内容
    bool from_cache = 2 [json_name = "fromCache"]; // 是否来自缓存
  }
  bool success = 1 [json_name = "success"]; // 是否成功
  string message = 2 [json_name = "message"]; // 响应消息
  Result result = 3 [json_name = "result"]; // 结果
}

// ========== 案件管理 ==========

// 创建案件请求
message CreateCaseRequest {
  ExtendedBasicInfo basic_info = 1 [json_name = "basicInfo"]; // 基本信息（可选）
}

// 创建案件响应
message CreateCaseResponse {
  message Result {
    string case_id = 1 [json_name = "caseId"]; // 案件ID
    google.protobuf.Timestamp created_at = 2 [json_name = "createdAt"]; // 创建时间
  }
  bool success = 1 [json_name = "success"]; // 是否成功
  string message = 2 [json_name = "message"]; // 响应消息
  Result result = 3 [json_name = "result"]; // 结果
}

// 获取案件信息请求
message GetCaseRequest {
  string case_id = 1 [json_name = "caseId"]; // 案件ID
}

// 获取案件信息响应
message GetCaseResponse {
  message Result {
    string case_id = 1 [json_name = "caseId"]; // 案件ID
    ExtendedBasicInfo basic_info = 2 [json_name = "basicInfo"]; // 基本信息
    repeated AwardInfo awards = 3 [json_name = "awards"]; // 奖项列表
    google.protobuf.Timestamp created_at = 4 [json_name = "createdAt"]; // 创建时间
    google.protobuf.Timestamp updated_at = 5 [json_name = "updatedAt"]; // 更新时间
  }
  bool success = 1 [json_name = "success"]; // 是否成功
  string message = 2 [json_name = "message"]; // 响应消息
  Result result = 3 [json_name = "result"]; // 结果
}

// 移民AI代理服务
service ImmigrantAIAgent {
  // 生成策划案:根据请求信息返回策划结果
  rpc GeneratePlan(GeneratePlanRequest) returns (GeneratePlanResponse) {
    option (google.api.http) = {
      post: "/api/pre-review/generatePlan"
      body: "*"
    };
  }
  // 获取推荐信列表:使用ai生成推荐信
  rpc GetRecommendLetter(GetRecommendLetterRequest) returns (GetRecommendLetterResponse) {
    option (google.api.http) = {
      post: "/api/pre-review/getRecommondLetter"
      body: "*"
    };
  }

  // 生成申请材料（个人陈述、赴美计划、文件目录）-使用ai生成
  rpc GenerateApplicationMaterials(GenerateApplicationMaterialsRequest) returns (GenerateApplicationMaterialsResponse) {
    option (google.api.http) = {
      post: "/api/pre-review/generateApplicationMaterials"
      body: "*"
    };
  }

  // 案件评测-使用ai分析
  rpc EvaluateCase(EvaluateCaseRequest) returns (EvaluateCaseResponse) {
    option (google.api.http) = {
      post: "/api/pre-review/evaluateCase"
      body: "*"
    };
  }

  // 提交异步任务
  rpc SubmitTask(SubmitTaskRequest) returns (SubmitTaskResponse) {
    option (google.api.http) = {
      post: "/api/task/submit"
      body: "*"
    };
  }

  // 查询任务状态
  rpc TaskQuery(TaskQueryRequest) returns (TaskQueryResponse) {
    option (google.api.http) = {
      post: "/api/task/query"
      body: "*"
    };
  }

  // 取消任务
  rpc CancelTask(TaskCancelRequest) returns (TaskCancelResponse) {
    option (google.api.http) = {
      post: "/api/task/cancel"
      body: "*"
    };
  }

  // 护照状态查询:快速查询CEAC护照状态
  rpc PassportStatusQuery(PassportStatusQueryRequest) returns (PassportStatusQueryResponse) {
    option (google.api.http) = {
      post: "/api/passport/statusQuery"
      body: "*"
    };
  }

  // 列出输出文件:列出output文件夹下的所有文件和文件夹
  rpc ListOutputFiles(ListOutputFilesRequest) returns (ListOutputFilesResponse) {
    option (google.api.http) = {
      post: "/api/output/listFiles"
      body: "*"
    };
  }

  // 下载输出文件:下载output文件夹下的指定文件或文件夹
  rpc DownloadOutputFile(DownloadOutputFileRequest) returns (DownloadOutputFileResponse) {
    option (google.api.http) = {
      post: "/api/output/download"
      body: "*"
    };
  }

  // ========== 基本信息管理 ==========
  // 上传简历文件:上传简历文件
  rpc UploadResumeFile(UploadResumeFileRequest) returns (UploadResumeFileResponse) {
    option (google.api.http) = {
      post: "/api/case/uploadResumeFile"
      body: "*"
    };
  }

  // 保存基本信息:保存或更新申请人的基本信息
  rpc SaveBasicInfo(SaveBasicInfoRequest) returns (SaveBasicInfoResponse) {
    option (google.api.http) = {
      post: "/api/case/saveBasicInfo"
      body: "*"
    };
  }

  // 获取基本信息:根据案件ID获取基本信息
  rpc GetBasicInfo(GetBasicInfoRequest) returns (GetBasicInfoResponse) {
    option (google.api.http) = {
      post: "/api/case/getBasicInfo"
      body: "*"
    };
  }

  // 保存基本信息草稿:保存基本信息草稿，不提交
  rpc SaveBasicInfoDraft(SaveBasicInfoDraftRequest) returns (SaveBasicInfoDraftResponse) {
    option (google.api.http) = {
      post: "/api/case/saveBasicInfoDraft"
      body: "*"
    };
  }

  // ========== 案件管理 ==========

  // 创建案件:创建一个新的案件
  rpc CreateCase(CreateCaseRequest) returns (CreateCaseResponse) {
    option (google.api.http) = {
      post: "/api/case/create"
      body: "*"
    };
  }

  // 获取案件信息:获取完整的案件信息，包括基本信息和奖项列表
  rpc GetCase(GetCaseRequest) returns (GetCaseResponse) {
    option (google.api.http) = {
      post: "/api/case/get"
      body: "*"
    };
  }

  // ========== 奖项管理 ==========

  // 创建奖项:为案件创建一个新的奖项
  rpc CreateAward(CreateAwardRequest) returns (CreateAwardResponse) {
    option (google.api.http) = {
      post: "/api/award/create"
      body: "*"
    };
  }

  // 获取奖项列表:获取案件的所有奖项列表
  rpc ListAwards(ListAwardsRequest) returns (ListAwardsResponse) {
    option (google.api.http) = {
      post: "/api/award/list"
      body: "*"
    };
  }

  // 更新奖项:更新奖项信息
  rpc UpdateAward(UpdateAwardRequest) returns (UpdateAwardResponse) {
    option (google.api.http) = {
      post: "/api/award/update"
      body: "*"
    };
  }

  // 删除奖项:删除指定的奖项
  rpc DeleteAward(DeleteAwardRequest) returns (DeleteAwardResponse) {
    option (google.api.http) = {
      post: "/api/award/delete"
      body: "*"
    };
  }

  // 锁定奖项:锁定奖项，表示证据链已归档
  rpc LockAward(LockAwardRequest) returns (LockAwardResponse) {
    option (google.api.http) = {
      post: "/api/award/lock"
      body: "*"
    };
  }

  // 解锁奖项:解锁已锁定的奖项
  rpc UnlockAward(UnlockAwardRequest) returns (UnlockAwardResponse) {
    option (google.api.http) = {
      post: "/api/award/unlock"
      body: "*"
    };
  }

  // ========== 奖项文件管理 ==========

  // 上传奖项文件:上传奖项相关的文件
  rpc UploadAwardFile(UploadAwardFileRequest) returns (UploadAwardFileResponse) {
    option (google.api.http) = {
      post: "/api/award/uploadFile"
      body: "*"
    };
  }

  // 删除奖项文件:删除指定的奖项文件
  rpc DeleteAwardFile(DeleteAwardFileRequest) returns (DeleteAwardFileResponse) {
    option (google.api.http) = {
      post: "/api/award/deleteFile"
      body: "*"
    };
  }

  // 列出奖项文件:获取奖项的所有文件列表
  rpc ListAwardFiles(ListAwardFilesRequest) returns (ListAwardFilesResponse) {
    option (google.api.http) = {
      post: "/api/award/listFiles"
      body: "*"
    };
  }

  // 检索奖项补充材料:使用AI检索互联网上的补充材料
  rpc SearchAwardMaterials(SearchAwardMaterialsRequest) returns (SearchAwardMaterialsResponse) {
    option (google.api.http) = {
      post: "/api/award/searchMaterials"
      body: "*"
    };
  }

  // 获取奖项所需文件列表:根据奖项信息返回需要收集的文件清单
  rpc GetAwardRequiredFiles(GetAwardRequiredFilesRequest) returns (GetAwardRequiredFilesResponse) {
    option (google.api.http) = {
      post: "/api/award/getRequiredFiles"
      body: "*"
    };
  }

  // ========== 奖项聊天消息管理 ==========

  // 保存奖项聊天消息:全量覆盖模式，保存奖项的所有聊天消息
  rpc SaveAwardChatMessages(SaveAwardChatMessagesRequest) returns (SaveAwardChatMessagesResponse) {
    option (google.api.http) = {
      post: "/api/award/saveChatMessages"
      body: "*"
    };
  }

  // 获取奖项聊天消息:分页获取奖项的聊天消息
  rpc GetAwardChatMessages(GetAwardChatMessagesRequest) returns (GetAwardChatMessagesResponse) {
    option (google.api.http) = {
      post: "/api/award/getChatMessages"
      body: "*"
    };
  }

  // 删除奖项聊天消息:删除指定的聊天消息
  rpc DeleteAwardChatMessages(DeleteAwardChatMessagesRequest) returns (DeleteAwardChatMessagesResponse) {
    option (google.api.http) = {
      post: "/api/award/deleteChatMessages"
      body: "*"
    };
  }

  // ========== 模块引导文案管理 ==========

  // 获取模块引导文案:根据案件基本信息生成个性化的模块引导文案
  rpc GetModuleGuide(GetModuleGuideRequest) returns (GetModuleGuideResponse) {
    option (google.api.http) = {
      post: "/api/case/module_guide"
      body: "*"
    };
  }
}
